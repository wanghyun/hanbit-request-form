<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>상담 예약</title>
  <style>
    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }
    .wrap {
      max-width: 860px;
      margin: 60px auto;
      padding: 0 20px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 14px 40px rgba(14, 30, 62, 0.10);
      padding: 30px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }
    .desc {
      color: #6b7280;
      margin-bottom: 26px;
    }
    .quote-info {
      padding: 18px;
      border-radius: 18px;
      background: #f8fbff;
      border: 1px solid #d9e6ff;
      margin-bottom: 22px;
    }
    .quote-info div {
      margin: 8px 0;
      font-size: 14px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .field.full {
      grid-column: 1 / -1;
    }
    label {
      font-size: 14px;
      font-weight: 700;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid #dbe4ef;
      border-radius: 14px;
      padding: 14px 15px;
      font-size: 15px;
      outline: none;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 22px;
      border-radius: 14px;
      font-weight: 800;
      text-decoration: none;
      border: 1px solid #d9e1ec;
      background: #fff;
      color: #1f2937;
      cursor: pointer;
    }
    .btn-primary {
      background: #1946b9;
      border-color: #1946b9;
      color: #fff;
    }
    .note {
      margin-top: 16px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.6;
    }
    @media (max-width: 860px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>상담 예약</h1>
      <div class="desc">
        견적 내용을 바탕으로 상담 일정을 예약할 수 있습니다.
        담당자가 확인 후 순차적으로 안내드립니다.
      </div>

      <div class="quote-info">
        <div><strong>견적번호:</strong> <span id="quoteIdText">확인 중...</span></div>
        <div><strong>업체명:</strong> <span id="companyNameText">확인 중...</span></div>
        <div><strong>담당자:</strong> <span id="managerNameText">확인 중...</span></div>
      </div>

      <form id="reserveForm" method="post" action="YOUR_APPS_SCRIPT_WEBAPP_URL">
        <input type="hidden" name="action_type" value="consult_reservation">
        <input type="hidden" name="quote_id" id="quoteIdInput">
        <input type="hidden" name="inquiry_id" id="inquiryIdInput">
        <input type="hidden" name="company_name" id="companyNameInput">
        <input type="hidden" name="manager_name" id="managerNameInput">
        <input type="hidden" name="phone" id="phoneInput">
        <input type="hidden" name="email" id="emailInput">
        <input type="hidden" name="_next" value="./reserve-complete.html">

        <div class="form-grid">
          <div class="field">
            <label>희망 상담일</label>
            <input type="date" name="preferred_date" required>
          </div>

          <div class="field">
            <label>희망 시간대</label>
            <select name="preferred_time" required>
              <option value="">선택해주세요</option>
              <option value="오전 10:00 ~ 11:00">오전 10:00 ~ 11:00</option>
              <option value="오전 11:00 ~ 12:00">오전 11:00 ~ 12:00</option>
              <option value="오후 1:00 ~ 2:00">오후 1:00 ~ 2:00</option>
              <option value="오후 2:00 ~ 3:00">오후 2:00 ~ 3:00</option>
              <option value="오후 3:00 ~ 4:00">오후 3:00 ~ 4:00</option>
              <option value="오후 4:00 ~ 5:00">오후 4:00 ~ 5:00</option>
            </select>
          </div>

          <div class="field">
            <label>상담 방식</label>
            <select name="consult_type" required>
              <option value="">선택해주세요</option>
              <option value="전화 상담">전화 상담</option>
              <option value="줌 미팅">줌 미팅</option>
              <option value="카카오톡 상담">카카오톡 상담</option>
              <option value="대면 상담">대면 상담</option>
            </select>
          </div>

          <div class="field">
            <label>연락 가능한 번호 확인</label>
            <input type="text" id="phoneReadonly" readonly>
          </div>

          <div class="field full">
            <label>상담 시 미리 전달할 내용</label>
            <textarea name="message" placeholder="예: 예산 범위 조정, 일정 협의, 필요한 기능 추가 문의"></textarea>
          </div>
        </div>

        <div class="actions">
          <a href="#" id="backToQuoteBtn" class="btn">견적으로 돌아가기</a>
          <button type="submit" class="btn btn-primary">상담 예약 접수</button>
        </div>

        <div class="note">
          예약 접수 후 담당자가 검토하여 일정 확정 안내를 드립니다.
          예약 상황에 따라 시간 조정이 필요할 수 있습니다.
        </div>
      </form>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'YOUR_APPS_SCRIPT_WEBAPP_URL';
    const params = new URLSearchParams(location.search);
    const quoteId = params.get('quote') || '';

    async function loadQuoteInfo() {
      if (!quoteId) {
        alert('견적번호가 없습니다.');
        location.href = './index.html';
        return;
      }

      try {
        const res = await fetch(APPS_SCRIPT_URL + '?mode=quote&quote=' + encodeURIComponent(quoteId));
        const data = await res.json();

        if (!data.success) {
          alert('견적 정보를 찾을 수 없습니다.');
          location.href = './index.html';
          return;
        }

        const quote = data.quote || {};
        const inquiry = data.inquiry || {};

        document.getElementById('quoteIdText').textContent = quote.quote_id || quoteId;
        document.getElementById('companyNameText').textContent = inquiry.company_name || quote.company_name || '-';
        document.getElementById('managerNameText').textContent = inquiry.manager_name || '-';
        document.getElementById('phoneReadonly').value = inquiry.phone || '-';

        document.getElementById('quoteIdInput').value = quote.quote_id || quoteId;
        document.getElementById('inquiryIdInput').value = quote.inquiry_id || '';
        document.getElementById('companyNameInput').value = inquiry.company_name || quote.company_name || '';
        document.getElementById('managerNameInput').value = inquiry.manager_name || '';
        document.getElementById('phoneInput').value = inquiry.phone || '';
        document.getElementById('emailInput').value = inquiry.email || '';

        document.getElementById('backToQuoteBtn').href = './quote.html?quote=' + encodeURIComponent(quote.quote_id || quoteId);
        document.getElementById('reserveForm').action = APPS_SCRIPT_URL;

      } catch (err) {
        alert('견적 정보를 불러오지 못했습니다.');
        location.href = './index.html';
      }
    }

    loadQuoteInfo();
  </script>
</body>
</html>
