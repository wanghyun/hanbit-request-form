<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>견적 요청 완료</title>

<style>
body{
font-family:Arial;
background:#f5f7fb;
margin:0;
padding:0;
}

.container{
max-width:700px;
margin:100px auto;
background:white;
padding:50px;
border-radius:10px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
text-align:center;
}

.icon{
font-size:60px;
color:#2f6fed;
margin-bottom:20px;
}

h1{
margin-bottom:10px;
}

p{
color:#555;
line-height:1.6;
}

.box{
margin-top:30px;
padding:20px;
background:#f0f4ff;
border-radius:8px;
}

.btn{
margin-top:30px;
display:inline-block;
padding:12px 25px;
background:#2f6fed;
color:white;
text-decoration:none;
border-radius:6px;
}
</style>

</head>

<body>

<div class="container">

<div class="icon">✓</div>

<h1>견적 요청이 접수되었습니다</h1>

<p>
입력하신 내용을 기반으로<br>
예상 견적서가 이메일로 발송되었습니다.
</p>

<div class="box">

<p>
📧 메일을 확인해주세요.<br>
PDF 견적서가 첨부되어 있습니다.
</p>

<p>
담당자가 검토 후 상담 안내를 드립니다.
</p>

</div>

<a class="btn" href="index.html">
다시 견적 작성하기
</a>

</div>

</body>
</html>
