<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>접수 완료</title>
  <style>
    body { margin: 0; font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif; background: #f5f7fb; color: #1f2937; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { width: 100%; max-width: 640px; background: #fff; border: 1px solid #dbe2ea; border-radius: 20px; padding: 36px 28px; box-shadow: 0 12px 30px rgba(0,0,0,.08); text-align: center; }

    p { line-height: 1.7; }
    a { display: inline-block; margin-top: 18px; text-decoration: none; background: #1946b9; color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <h1>접수되었습니다</h1>
    <p>홈페이지 제작 요청서가 정상적으로 접수되었습니다.<br />확인 후 순차적으로 연락드리겠습니다.</p>
    <a href="./index.html">다시 작성하기</a>
