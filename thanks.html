<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>견적 요청 완료</title>
  <style>
    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }
    .wrap {
      max-width: 760px;
      margin: 80px auto;
      padding: 0 20px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 14px 40px rgba(14, 30, 62, 0.10);
      padding: 40px 32px;
      text-align: center;
    }
    .icon {
      width: 78px;
      height: 78px;
      border-radius: 999px;
      background: #eef4ff;
      color: #1946b9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 800;
      margin: 0 auto 22px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 32px;
    }
    p {
      margin: 0 0 18px;
      color: #6b7280;
      line-height: 1.6;
    }
    .quote-box {
      margin: 24px 0;
      padding: 20px;
      border-radius: 18px;
      background: #f8fbff;
      border: 1px solid #d9e6ff;
    }
    .quote-label {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 8px;
    }
    .quote-id {
      font-size: 26px;
      font-weight: 900;
      color: #1946b9;
    }
    .steps {
      text-align: left;
      margin: 28px 0;
      padding: 18px 20px;
      background: #fafcff;
      border: 1px solid #e3e8f1;
      border-radius: 18px;
    }
    .steps h3 {
      margin: 0 0 10px;
      font-size: 17px;
      color: #1946b9;
    }
    .steps div {
      margin: 8px 0;
      font-size: 14px;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 22px;
      border-radius: 14px;
      font-weight: 800;
      text-decoration: none;
      border: 1px solid #d9e1ec;
      background: #fff;
      color: #1f2937;
    }
    .btn-primary {
      background: #1946b9;
      border-color: #1946b9;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="icon">✓</div>
      <h1>견적 요청이 정상적으로 접수되었습니다</h1>
      <p>
        입력하신 내용을 바탕으로 예상 견적서가 이메일로 발송되었습니다.<br>
        아래 견적번호로 다시 조회하실 수 있습니다.
      </p>

      <div class="quote-box">
        <div class="quote-label">견적번호</div>
        <div class="quote-id" id="quoteIdText">확인 중...</div>
      </div>

      <div class="steps">
        <h3>다음 진행 절차</h3>
        <div>1. 접수 내용 검토</div>
        <div>2. 예상 견적서 이메일 발송 확인</div>
        <div>3. 필요 시 상담 예약</div>
        <div>4. 최종 견적 조정 및 일정 협의</div>
      </div>

      <div class="actions">
        <a href="./index.html" class="btn">다시 견적 작성하기</a>
        <a href="#" id="quoteViewBtn" class="btn btn-primary">견적 확인하기</a>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const quoteId = params.get('quote') || '';
    const quoteText = document.getElementById('quoteIdText');
    const quoteBtn = document.getElementById('quoteViewBtn');

    if (quoteId) {
      quoteText.textContent = quoteId;
      quoteBtn.href = './quote.html?quote=' + encodeURIComponent(quoteId);
    } else {
      quoteText.textContent = '견적번호가 없습니다';
      quoteBtn.href = './index.html';
      quoteBtn.textContent = '메인으로 이동';
    }
  </script>
</body>
</html>
